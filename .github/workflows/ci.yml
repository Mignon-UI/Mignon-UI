name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security Audit (bun audit)
        run: bun audit --audit-level=high

      - name: Run ESLint
        run: bun run lint

      - name: Run Bun Tests
        run: bun test

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    container: ghcr.io/mignon-ui/mignon-ui-ci-runner:latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo Clippy (lints & check)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings

      - name: Cargo Audit (vulnerability scan)
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: src-tauri
        continue-on-error: true
